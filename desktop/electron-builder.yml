# Packaging config. Budget mode ($0): macOS builds are ad-hoc signed (no Apple
# Developer ID / notarization) and Windows builds are unsigned.
appId: app.coolwrite.desktop
productName: Cool Write
copyright: Copyright © 2026 Cool Write

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

# Predictable names for the stage script: CoolWrite-<version>-<mac|win>-<arch>.<ext>
artifactName: CoolWrite-${version}-${os}-${arch}.${ext}

asar: true

# Registered now so phase 2 (browser sign-in) can hand the login back via coolwrite://
protocols:
  - name: Cool Write
    schemes: [coolwrite]

mac:
  category: public.app-category.productivity
  icon: build/icon.png # 1024px, generated by brand/generate-icons.mjs
  target:
    - target: dmg
    - target: zip # the mac self-updater installs from the zip (phase 5)
  # "-" = ad-hoc signature. Required: Apple Silicon refuses to run unsigned code,
  # and an invalid signature shows "app is damaged". Swap for a Developer ID later.
  identity: "-"
  hardenedRuntime: false
  notarize: false

dmg:
  title: Cool Write ${version}

win:
  icon: build/icon.ico # 16–256px, generated by brand/generate-icons.mjs
  target:
    - target: nsis

nsis:
  oneClick: true
  perMachine: false # per-user install: no admin prompt, silent updates later
  deleteAppDataOnUninstall: false

# Makes electron-builder emit latest.yml (needed by electron-updater on Windows).
# The URL is a placeholder: the app points the updater at the exact version it
# verified in the signed manifest (src/updater/win.ts). Builds use --publish never.
publish:
  provider: generic
  url: https://updates.invalid/
